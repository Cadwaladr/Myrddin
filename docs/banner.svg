<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-labelledby="t d">
  <title id="t">Myrddin</title>
  <desc id="d">Frame generation and runtime tuning for Star Citizen on Linux. A row of bars: each solid bar is a frame the game rendered, the outlined bars between them are generated frames.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1218"/>
      <stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <g id="real"><rect width="10" height="46" rx="2" fill="#e8eef5"/></g>
    <g id="made"><rect x="0.75" y="0.75" width="8.5" height="44.5" rx="2" fill="none" stroke="#56c2b3" stroke-width="1.5"/></g>
    <g id="group">
      <use href="#real" x="0"/>
      <use href="#made" x="22"/>
      <use href="#made" x="44"/>
      <use href="#made" x="66"/>
    </g>
  </defs>
  <rect width="1280" height="300" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="299" rx="13.5" fill="none" stroke="#243140"/>
  <text x="72" y="138" fill="#f2f5f9" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="600" letter-spacing="14">MYRDDIN</text>
  <text x="74" y="184" fill="#93a3b5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" letter-spacing="0.4">Frame generation and runtime tuning for Star Citizen on Linux</text>
  <g transform="translate(74 216)">
    <use href="#group" x="0"/>
    <use href="#group" x="88"/>
    <use href="#group" x="176"/>
    <use href="#group" x="264"/>
    <use href="#group" x="352"/>
    <use href="#group" x="440"/>
    <use href="#group" x="528"/>
    <use href="#group" x="616"/>
    <use href="#group" x="704"/>
    <use href="#group" x="792"/>
    <use href="#group" x="880"/>
    <use href="#group" x="968"/>
    <use href="#real" x="1056"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#6f8296">
    <rect x="950" y="84" width="10" height="14" rx="2" fill="#e8eef5"/>
    <text x="970" y="96">rendered by the game</text>
    <rect x="950.75" y="110.75" width="8.5" height="12.5" rx="2" fill="none" stroke="#56c2b3" stroke-width="1.5"/>
    <text x="970" y="122">generated in between</text>
  </g>
</svg>
