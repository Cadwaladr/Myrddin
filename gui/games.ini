# The games Myrddin's launcher window shows (sc-turbo gui): one section per game, named as the
# game is to be called in the window.
#
#   icon        names from the icon theme, or files: the first that exists. The game's own icon is
#               not part of this project; the LUG Helper installs "starcitizen" and "rsi-launcher".
#   process     the game's process name, to tell whether it runs
#   launch      what a click on the icon starts; {n} is the multiplier chosen below the icon
#   launch_off  the same at 1x: the game without frame generation
#   mult        run when the multiplier is changed while the game is up; {n} as above
#   off, on     run when it is taken to 1x and back while the game is up
#   log         the folder the layer writes fg-<pid>.log to: what it is doing now is read from there
#   min, max    the range of the multiplier (1: no generated frames)
#
# Commands run in the project's folder.

[Star Citizen]
icon = starcitizen, rsi-launcher
process = StarCitizen.exe
launch = ./sc-turbo fg {n}
launch_off = ./sc-turbo run
mult = ./sc-turbo fg-mult {n}
off = ./sc-turbo fg-off
on = ./sc-turbo fg-on
log = logs/fg
min = 1
max = 4
