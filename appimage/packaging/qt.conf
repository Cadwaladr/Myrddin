; Lies beside usr/bin/myrddin in the AppImage. Prefix is relative to that folder, so Qt looks for
; its plugins and QML modules in usr/plugins and usr/qml without any environment variable.
; (Folders the host names in QT_PLUGIN_PATH or QML_IMPORT_PATH are still searched as well: Qt's
; own behaviour, nothing the AppImage sets.)
[Paths]
Prefix = ..
Libraries = lib
Plugins = plugins
QmlImports = qml
Qml2Imports = qml
